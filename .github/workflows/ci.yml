name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      # No --frozen: the generator does not emit a uv.lock. Run `uv lock`,
      # commit the lockfile, and add --frozen for fully reproducible CI.
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      # No --frozen: the generator does not emit a uv.lock. Run `uv lock`,
      # commit the lockfile, and add --frozen for fully reproducible CI.
      - run: uv sync --all-extras
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      # No --frozen: the generator does not emit a uv.lock. Run `uv lock`,
      # commit the lockfile, and add --frozen for fully reproducible CI.
      - run: uv sync --all-extras
      - run: uv build
