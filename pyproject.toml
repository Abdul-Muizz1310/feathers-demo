[project]
name = "feathers_demo"
version = "0.1.0"
description = "Live demo service generated by feathers-cli"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "alembic>=1.19.1",
    "structlog>=26.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    # Starlette's TestClient runs on httpx2 (plain httpx there is deprecated).
    "httpx2>=2.15",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feathers_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
