[project]
name = "feathers_demo"
version = "0.1.0"
description = "Live demo service generated by feathers-cli"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "aiosqlite>=0.22",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "structlog>=26.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    # Starlette's TestClient runs on httpx2 (plain httpx there is deprecated).
    "httpx2>=2.16.2",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feathers_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
